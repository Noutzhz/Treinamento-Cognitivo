<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pro Reaction | Treino Cognitivo Esportivo</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-color: #1e1e24;
      --accent-color: #00d4ff;
      --go-color: #00ff66;
      --nogo-color: #ff3333;
      --text-color: #ffffff;
    }

    body {
      font-family: 'Roboto Mono', monospace; /* Fonte técnica */
      background: var(--bg-color);
      color: var(--text-color);
      text-align: center;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none; /* Evita seleção de texto ao tocar rápido */
    }

    h1 {
      margin: 15px 0;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    /* O GRID (A Parede de Luzes) */
    #grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr); /* 5x5 Grid */
      gap: 10px;
      width: 95%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      margin: 10px auto;
      background: var(--panel-color);
      padding: 10px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .cell {
      background: #2a2a35;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
      position: relative;
    }

    /* Estados das Luzes */
    .cell.active-go {
      background: var(--go-color);
      box-shadow: 0 0 15px var(--go-color);
      transform: scale(0.95);
    }

    .cell.active-nogo {
      background: var(--nogo-color);
      box-shadow: 0 0 15px var(--nogo-color);
    }

    /* Painel de Controle e Stats */
    #hud {
      display: flex;
      justify-content: space-around;
      width: 90%;
      max-width: 600px;
      background: #1a1a1a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid #333;
    }

    .stat-box {
      font-size: 0.9rem;
    }
    .stat-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
      display: block;
    }

    /* Controles */
    #controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.2s;
    }

    button:hover {
      background: #6fffe9;
      transform: translateY(-2px);
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
    }

    select {
      padding: 10px;
      border-radius: 5px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
    }

    #message {
      height: 20px;
      color: #ffcc00;
      font-weight: bold;
      margin-bottom: 5px;
    }

  </style>
</head>
<body>

  <h1>Neuro Performance Lab</h1>

  <div id="hud">
    <div class="stat-box">TEMPO<span class="stat-value" id="timerDisplay">30.0</span></div>
    <div class="stat-box">SCORE<span class="stat-value" id="scoreDisplay">0</span></div>
    <div class="stat-box">REACTION (ms)<span class="stat-value" id="msDisplay">--</span></div>
  </div>

  <div id="message"></div>

  <div id="grid-container">
    </div>

  <div id="controls">
    <select id="difficulty">
      <option value="easy">Iniciante (Lento)</option>
      <option value="medium" selected>Atleta (Médio)</option>
      <option value="pro">Pro (Rápido + Distração)</option>
    </select>
    <button id="btnStart" onclick="startDrill()">Iniciar Treino</button>
  </div>

  <script>
    const gridContainer = document.getElementById('grid-container');
    const timerDisplay = document.getElementById('timerDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const msDisplay = document.getElementById('msDisplay');
    const msgDisplay = document.getElementById('message');
    const btnStart = document.getElementById('btnStart');
    const difficultySelect = document.getElementById('difficulty');

    // Configurações do Treino
    const gridSize = 25; // 5x5
    let gameDuration = 30; // segundos
    let timerInterval;
    let spawnTimeout;
    let isPlaying = false;
    
    // Estado do Jogo
    let score = 0;
    let reactionTimes = [];
    let currentTargetTime = 0;
    let activeIndex = -1;
    
    // Configurações de Dificuldade
    let config = {
      spawnRate: 1000,    // Tempo entre aparições
      lightDuration: 900, // Quanto tempo a luz fica acesa (janela de oportunidade)
      distractionChance: 0 // Chance de aparecer luz vermelha
    };

    // Inicializa o Grid
    function createGrid() {
      gridContainer.innerHTML = '';
      for (let i = 0; i < gridSize; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        cell.dataset.index = i;
        // Evento de toque/clique (Touchstart para resposta mais rápida no mobile)
        cell.addEventListener('mousedown', () => handleInput(i));
        cell.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(i); });
        gridContainer.appendChild(cell);
      }
    }

    function setDifficulty() {
      const level = difficultySelect.value;
      if (level === 'easy') {
        config.spawnRate = 1500;
        config.lightDuration = 1200;
        config.distractionChance = 0;
      } else if (level === 'medium') {
        config.spawnRate = 1000; // 1 segundo
        config.lightDuration = 800; // Pisca rápido
        config.distractionChance = 0.2; // 20% de chance de ser vermelho
      } else { // Pro
        config.spawnRate = 700;
        config.lightDuration = 550; // Muito rápido
        config.distractionChance = 0.4; // Muita distração
      }
    }

    function startDrill() {
      if (isPlaying) return;
      
      setDifficulty();
      createGrid(); // Reseta visual
      
      score = 0;
      reactionTimes = [];
      gameDuration = 30;
      isPlaying = true;
      
      scoreDisplay.textContent = '0';
      msDisplay.textContent = '--';
      timerDisplay.textContent = gameDuration.toFixed(1);
      msgDisplay.textContent = "VERDE = Toca / VERMELHO = Ignora";
      
      btnStart.disabled = true;
      difficultySelect.disabled = true;

      // Timer Global
      timerInterval = setInterval(() => {
        gameDuration -= 0.1;
        timerDisplay.textContent = gameDuration.toFixed(1);
        if (gameDuration <= 0) finishDrill();
      }, 100);

      // Loop de Luzes
      nextLight();
    }

    function nextLight() {
      if (!isPlaying) return;

      // Limpa luz anterior se houver
      clearLights();

      // Intervalo aleatório pequeno para não ficar robótico
      const randomDelay = Math.random() * 300 + 200; 

      spawnTimeout = setTimeout(() => {
        if (!isPlaying) return;
        
        // Escolhe célula aleatória
        activeIndex = Math.floor(Math.random() * gridSize);
        const cells = document.querySelectorAll('.cell');
        const cell = cells[activeIndex];

        // Decide se é ALVO (Verde) ou DISTRAÇÃO (Vermelho)
        const isDistraction = Math.random() < config.distractionChance;
        
        if (isDistraction) {
          cell.classList.add('active-nogo');
          cell.dataset.type = 'nogo';
        } else {
          cell.classList.add('active-go');
          cell.dataset.type = 'go';
          currentTargetTime = performance.now();
        }

        // Define o tempo que a luz fica acesa (Janela de Pressão)
        // Se o usuário não clicar a tempo, conta como erro (miss)
        setTimeout(() => {
          if (isPlaying && cell.classList.contains('active-go')) {
             // O jogador perdeu a janela de oportunidade
             handleMiss();
             cell.classList.remove('active-go');
          } else if (isPlaying && cell.classList.contains('active-nogo')) {
             // O jogador fez o certo (não clicou no vermelho), remove sem penalidade
             cell.classList.remove('active-nogo');
          }
          
          // Chama a próxima luz se o jogo ainda rolar
          if (isPlaying && !document.querySelector('.active-go') && !document.querySelector('.active-nogo')) {
             nextLight();
          }
        }, config.lightDuration);

      }, randomDelay);
    }

    function handleInput(index) {
      if (!isPlaying) return;
      
      const cells = document.querySelectorAll('.cell');
      const cell = cells[index];

      // CLIQUE NO VERDE (Correto)
      if (cell.classList.contains('active-go')) {
        const reactionTime = Math.round(performance.now() - currentTargetTime);
        reactionTimes.push(reactionTime);
        updateStats(reactionTime);
        
        score += 10;
        scoreDisplay.textContent = score;
        
        // Flash visual de sucesso (opcional) e limpa
        clearLights();
        clearTimeout(spawnTimeout); 
        nextLight(); // Imediatamente chama a próxima
      } 
      // CLIQUE NO VERMELHO (Erro de Impulso)
      else if (cell.classList.contains('active-nogo')) {
        score -= 5; // Penalidade
        scoreDisplay.textContent = score;
        msgDisplay.textContent = "NÃO TOQUE NO VERMELHO!";
        flashScreen('#330000');
        
        clearLights();
        clearTimeout(spawnTimeout);
        nextLight();
      }
      // CLIQUE NO VAZIO (Erro espacial)
      else {
        score -= 1; // Penalidade leve
        scoreDisplay.textContent = score;
      }
    }

    function handleMiss() {
      // Perdeu o verde
      msgDisplay.textContent = "MUITO LENTO!";
      // Não tira ponto, mas perde a oportunidade de pontuar e afeta o ritmo
      nextLight();
    }

    function clearLights() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach(c => {
        c.classList.remove('active-go');
        c.classList.remove('active-nogo');
        delete c.dataset.type;
      });
    }

    function updateStats(lastTime) {
      // Calcula média
      const avg = reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length;
      msDisplay.textContent = `${lastTime} (Méd: ${Math.round(avg)})`;
    }

    function finishDrill() {
      isPlaying = false;
      clearInterval(timerInterval);
      clearTimeout(spawnTimeout);
      clearLights();
      
      btnStart.disabled = false;
      difficultySelect.disabled = false;
      
      const avg = reactionTimes.length > 0 ? Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length) : 0;
      
      msgDisplay.textContent = "TREINO FINALIZADO";
      alert(`Fim de Treino!\n\nScore Final: ${score}\nTempo de Reação Médio: ${avg}ms\nAcertos: ${reactionTimes.length}`);
    }

    function flashScreen(color) {
      document.body.style.backgroundColor = color;
      setTimeout(() => {
        document.body.style.backgroundColor = 'var(--bg-color)';
      }, 100);
    }

    // Inicia grid vazio
    createGrid();
  </script>
</body>
</html>
